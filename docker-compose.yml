version: "3.9"

services:
  health-voice-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: health-voice-agent
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - index_store:/app/index_store
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  index_store:
    driver: local
